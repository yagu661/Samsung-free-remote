name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Prevent concurrent builds from interfering with the same release
concurrency:
  group: android-apk-release
  cancel-in-progress: true

jobs:
  build:
    name: Build Samsung AI Remote APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare Environment Configuration
        run: |
          # Ensure .env exists using .env.example template
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi
          # If repository secret GEMINI_API_KEY is configured, inject it
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Injecting GEMINI_API_KEY from repository secrets..."
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          fi
          ls -la .env

      - name: Configure Android Debug Keystore
        run: |
          # Restore debug.keystore from base64 if present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          # If still missing, generate a valid debug keystore
          if [ ! -f debug.keystore ]; then
            echo "Generating new debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and Prepare Release Asset
        run: |
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="Samsung-AI-Remote.apk"

          if [ ! -f "$ORIGINAL_APK" ]; then
            echo "::error::APK was not found at $ORIGINAL_APK"
            exit 1
          fi

          FILESIZE=$(stat -c%s "$ORIGINAL_APK" 2>/dev/null || stat -f%z "$ORIGINAL_APK")
          if [ "$FILESIZE" -le 1000000 ]; then
            echo "::error::Generated APK is suspiciously small ($FILESIZE bytes)"
            exit 1
          fi

          cp "$ORIGINAL_APK" "$TARGET_APK"
          echo "Successfully created $TARGET_APK ($FILESIZE bytes)"
          ls -lh "$TARGET_APK"

      - name: Package Samsung TV Tizen App (.wgt)
        run: |
          echo "Packaging Samsung TV Assistant Web Application (.wgt)..."
          cd tizen-assistant-app
          rm -f SamsungAssistant.wgt
          zip -r SamsungAssistant.wgt config.xml index.html css/ js/ icon.png
          cp SamsungAssistant.wgt ../SamsungAssistant.wgt
          cd ..
          zip -r Samsung-TV-App-Termux-Installer.zip tizen-assistant-app/ -x "*.git*"
          ls -lh SamsungAssistant.wgt Samsung-TV-App-Termux-Installer.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-TV-And-Remote-Suite
          path: |
            Samsung-AI-Remote.apk
            SamsungAssistant.wgt
            Samsung-TV-App-Termux-Installer.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v-latest"
          name: "Samsung AI Remote & TV Assistant (Latest Builds)"
          body: |
            ## 🚀 Samsung AI Remote & TV Assistant — Dual App Suite

            Fresh installable Android APK and Samsung Tizen TV package automatically built and verified by **GitHub Actions**.

            ### 📦 Downloads (Under Assets Below):
            1. **📱 Android Phone Remote APK:** [Samsung-AI-Remote.apk](https://github.com/${{ github.repository }}/releases/download/v-latest/Samsung-AI-Remote.apk)
               - **Target Phone:** Samsung Galaxy M30s (Android 11+)
               - **Features:** Complete TV remote control, voice search, YouTube integration, OpenRouter / Gemini AI assistant, and built-in TV App installer server!
            2. **📺 Samsung Smart TV App (.wgt):** [SamsungAssistant.wgt](https://github.com/${{ github.repository }}/releases/download/v-latest/SamsungAssistant.wgt)
               - **Target TV:** Samsung UA32T4410AKXXL (Tizen OS 5.5 / 5.0)
               - **Features:** Standalone 10-foot TV UI, YouTube player, Spotify, Netflix launcher, and on-screen AI assistant HUD!
            3. **🛠️ Termux Installer Bundle:** [Samsung-TV-App-Termux-Installer.zip](https://github.com/${{ github.repository }}/releases/download/v-latest/Samsung-TV-App-Termux-Installer.zip)
               - Includes `termux_sdb_deploy.py` and all TV app source files for 1-command deployment from Termux on your phone!

            ---

            ### 📲 How to Download & Install the Phone Remote App:
            1. Under **Assets** below, tap **`Samsung-AI-Remote.apk`** to download it to your Samsung Galaxy M30s.
            2. Open **My Files** > **Downloads** > tap **Samsung-AI-Remote.apk** > tap **Install**.
            3. Open the app and connect to your Samsung TV on the same Wi-Fi.

            ---

            ### 📺 How to Download & Install the TV App on your Samsung TV:

            #### Method 1: Using the Phone Remote App (Simplest)
            1. Install and open the **Samsung-AI-Remote.apk** on your Galaxy M30s.
            2. Go to **Settings** > **Tizen TV Assistant App Installer**.
            3. Tap **"Start TV Installer Server"** (it displays your phone's Wi-Fi IP).
            4. On your TV:
               - Open **Apps** > Press **1, 2, 3, 4, 5** on your remote.
               - Turn **Developer Mode ON** and enter your phone's IP address.
               - Restart TV by holding the remote **Power** button for 5 seconds.
               - Open **Apps** > Options (gear icon) > **App Sync**.
            5. The TV will download `SamsungAssistant.wgt` directly from your phone and install it into your TV's Apps menu!

            #### Method 2: Download Directly from GitHub Releases & Deploy via Termux
            1. In Termux on your Galaxy M30s, run:
               ```bash
               curl -L -O https://github.com/${{ github.repository }}/releases/download/v-latest/SamsungAssistant.wgt
               ```
               Or clone the repository:
               ```bash
               git pull origin main
               cd tizen-assistant-app
               python termux_sdb_deploy.py <TV_IP>
               ```
            2. Done! The TV app will be installed and ready to launch!

            ---
            *Commit SHA: `${{ github.sha }}` | Branch: `${{ github.ref_name }}` | Built with love by Soumya*
          files: |
            Samsung-AI-Remote.apk
            SamsungAssistant.wgt
            Samsung-TV-App-Termux-Installer.zip
          fail_on_unmatched_files: true
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
