name: Build Android APK and Tizen Package

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Samsung AI Remote & Tizen Installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Package Tizen WGT
        run: |
          cd tizen-assistant-app
          zip -r SamsungAssistant.wgt config.xml index.html css/ js/ icon.png
          ls -la SamsungAssistant.wgt

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK & WGT Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-AI-Remote-Build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            tizen-assistant-app/SamsungAssistant.wgt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Samsung AI Remote & Tizen TV Installer v1.0.0"
          body: |
            ## Samsung AI Remote & Native Tizen TV Installer for Android
            Built with ❤️ for Samsung Galaxy M30s and Samsung Smart TVs (UA32T4410AKXXL / Tizen 5.5).

            ### Assets Included:
            - **`app-debug.apk`**: Install on your Samsung Galaxy M30s phone (TV Remote, AI Voice Assistant, and SDB TV App Installer).
            - **`SamsungAssistant.wgt`**: Custom Tizen Smart TV Assistant application package.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            tizen-assistant-app/SamsungAssistant.wgt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
